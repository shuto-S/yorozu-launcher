name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project Yorozu.xcodeproj \
            -scheme Yorozu \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit and integration tests
        run: |
          xcodebuild \
            -project Yorozu.xcodeproj \
            -scheme Yorozu \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:YorozuTests \
            CODE_SIGNING_ALLOWED=NO \
            test
